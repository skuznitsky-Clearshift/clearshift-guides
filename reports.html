<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>קלירשיפט: הוצאת דוחות מהמערכת</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--teal:#167398;--teal2:#3595bb;--dark:#0e4a63;--ink:#1d1d1f;--sub:#6e6e73;--line:#e5e5ea;--bg:#f5f5f7;--orange:#ff9f1c}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Heebo,Arial,sans-serif;line-height:1.4}
#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg)}
header{flex:none;padding:14px 18px 10px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.logo{font-weight:800;font-size:22px;color:var(--teal);letter-spacing:-.3px}
.count{font-size:14px;font-weight:600;color:var(--teal);background:rgba(22,115,152,.1);padding:4px 12px;border-radius:999px;white-space:nowrap}
.bar{height:6px;background:var(--line);border-radius:999px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--teal);border-radius:999px;transition:width .35s}
main{flex:1;overflow-y:auto;padding:6px 18px 18px;-webkit-overflow-scrolling:touch}
.kick{display:inline-block;font-size:14px;font-weight:600;color:var(--teal);background:rgba(22,115,152,.1);padding:4px 12px;border-radius:999px;margin:6px 0 8px}
h1{font-size:27px;line-height:1.15;font-weight:800;letter-spacing:-.3px;margin-bottom:12px}
.shot{display:block;width:100%;border:0;padding:0;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 8px 24px rgba(14,74,99,.14),0 0 0 1px var(--line);margin-bottom:14px;cursor:zoom-in;position:relative}
.shot img{display:block;width:100%;height:auto}
.shot span{position:absolute;bottom:8px;inset-inline-start:8px;font-size:12px;font-weight:600;color:#fff;background:rgba(14,74,99,.75);padding:3px 9px;border-radius:999px}
.card{background:#fff;border-radius:16px;padding:2px 16px;box-shadow:0 0 0 1px var(--line)}
.row{font-size:18px;padding:13px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row b{font-weight:800;color:var(--dark)}
.tip{margin-top:12px;font-size:16px;font-weight:600;color:var(--dark);background:rgba(255,159,28,.16);border-radius:14px;padding:12px 14px}
.hero{border-radius:22px;background:radial-gradient(circle at 75% 15%,#3fa3c9 0%,#167398 50%,#0e4a63 100%);color:#fff;padding:26px 22px;margin-top:6px}
.hero .k{font-size:15px;font-weight:600;opacity:.85;margin-bottom:8px}
.hero h1{font-size:30px;margin-bottom:12px}
.hero p{font-size:18px;opacity:.94}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.chip{font-size:15px;font-weight:600;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);padding:6px 12px;border-radius:999px}
.chip b{display:inline-block;background:var(--orange);border-radius:50%;width:22px;height:22px;line-height:22px;text-align:center;margin-inline-end:6px;font-size:13px}
.url{display:inline-block;direction:ltr;background:#fff;color:var(--dark);font-weight:800;font-size:20px;padding:8px 20px;border-radius:999px;margin:4px 0 14px;text-decoration:none}
.li{display:flex;align-items:center;gap:12px;font-size:17px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.2)}
.li:last-of-type{border:0}
.li b{flex:none;background:var(--orange);border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-weight:800}
.note{font-size:14px;color:var(--sub);margin-top:14px;text-align:center}
footer{flex:none;padding:10px 14px calc(12px + env(safe-area-inset-bottom));background:rgba(245,245,247,.96);border-top:1px solid var(--line)}
.playing{display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;color:var(--sub);height:20px;margin-bottom:8px}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:12px}
.eq i{width:3px;background:var(--teal);border-radius:2px;height:4px}
.on .eq i{animation:eq .8s infinite ease-in-out}
.on .eq i:nth-child(2){animation-delay:.2s}.on .eq i:nth-child(3){animation-delay:.4s}
@keyframes eq{0%,100%{height:3px}50%{height:12px}}
.btns{display:flex;gap:8px}
button{font:inherit;border:0;cursor:pointer}
.b{flex:1;min-height:54px;border-radius:14px;font-size:16px;font-weight:700;background:#fff;color:var(--dark);box-shadow:0 0 0 1px var(--line)}
.b:disabled{opacity:.35}
.b.next{flex:2.1;background:var(--teal);color:#fff;box-shadow:0 6px 16px rgba(22,115,152,.35);font-size:18px}
.b:active{transform:scale(.98)}
.wa{background:#0b141a;border-radius:18px;overflow:hidden;box-shadow:var(--sh,0 8px 24px rgba(0,0,0,.12));direction:ltr;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.wa-h{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#1f2c33;color:#e9edef;font-weight:600;font-size:16px}
.wa-h i{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#19a0b8,#167398);display:block;position:relative}
.wa-h i:after{content:"";position:absolute;left:9px;top:9px;width:13px;height:13px;border-left:4px solid #fff;border-bottom:4px solid #fff;border-radius:2px}
.wa-b{height:400px;padding:12px 10px 14px;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;overflow:hidden}
.wa-m{max-width:88%;border-radius:12px;padding:9px 11px 6px;color:#e9edef;font-size:14.5px;line-height:1.45;opacity:0;transform:translateY(10px);transition:opacity .35s,transform .35s;display:none;flex:0 0 auto}
.wa-m.on{display:block}.wa-m.in{opacity:1;transform:none}
.wa-in{background:#1f2c33;align-self:flex-start;border-top-left-radius:3px}
.wa-out{background:#005c4b;align-self:flex-end;border-top-right-radius:3px}
.wa-m b{font-weight:700}.wa-t{font-size:16px;font-weight:700;margin-bottom:4px}
.wa-m .r{text-align:right;margin:5px 0}.wa-m time{display:block;text-align:right;font-size:11px;color:#8696a0;margin-top:2px}
.wa-btn{display:flex;align-items:center;justify-content:center;gap:8px;border-top:1px solid #2f3b43;margin:6px -11px 0;padding:9px 0 5px;color:#8696a0;font-size:15px;position:relative;transition:background .2s,color .2s}
.wa-btn u{width:15px;height:15px;border-radius:50%;display:block}.wa-btn .g{background:#25d366}.wa-btn .d{background:#ef3b3b}
.wa-btn.hit{background:#2b3b44;color:#e9edef}
.wa-tap{position:absolute;left:58%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(255,255,255,.35);border:2px solid rgba(255,255,255,.9);opacity:0;transform:scale(1.6);pointer-events:none}
.wa-btn.hit .wa-tap{animation:watap .7s ease-out}
@keyframes watap{0%{opacity:0;transform:scale(1.7)}35%{opacity:1;transform:scale(.8)}100%{opacity:0;transform:scale(1.25)}}
.wa-q{border-left:4px solid #ff8fb1;background:rgba(0,0,0,.22);border-radius:7px;padding:6px 9px;font-size:13px;margin-bottom:6px}.wa-q em{font-style:normal;color:#ff8fb1;font-weight:700;display:block}
.wa-cap{font-size:13px;color:var(--mut,#6b7a86);text-align:center;margin:8px 0 2px}
@media (prefers-reduced-motion:reduce){.wa-m{transition:none}.wa-btn.hit .wa-tap{animation:none}}
.b.next.glow{animation:glow 1.5s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 2px #fff,0 0 0 5px #35b6e6,0 0 0 5px rgba(53,182,230,.55)}50%{box-shadow:0 0 0 2px #fff,0 0 0 5px #35b6e6,0 0 0 15px rgba(53,182,230,0)}}
@media (prefers-reduced-motion:reduce){.b.next.glow{animation:none;box-shadow:0 0 0 2px #fff,0 0 0 5px #35b6e6}}
#zoom{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;z-index:9;overflow:auto;direction:ltr}
#zoom.open{display:block}
#zoom img{display:block;width:200%;max-width:none;height:auto}
#zoom button{position:fixed;top:14px;right:14px;width:44px;height:44px;border-radius:50%;background:#fff;font-size:22px;font-weight:700;color:var(--dark)}
#side{display:none}
@media (min-width:900px){
  body{background:#e9eef1}
  #app{max-width:440px;margin:0 auto 0 0;box-shadow:0 0 0 1px var(--line),0 20px 60px rgba(14,74,99,.18)}
  #side{display:block;position:fixed;top:40%;left:calc(440px + (100vw - 440px)/2);transform:translate(-50%,-50%);max-width:360px;text-align:center;color:var(--sub);font-size:17px}
  #side b{display:block;color:var(--dark);font-size:21px;margin-bottom:8px}
}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}.on .eq i{animation:none}}
</style>
<style id="lgcss">
#lang{position:fixed;inset:0;z-index:999;background:#fff;display:flex;align-items:center;justify-content:center;padding:30px 26px;direction:ltr;overflow:auto;font-family:Heebo,Arial,sans-serif}
#lang .lgbox{width:100%;max-width:340px;text-align:center}
#lang .lglogo{height:48px;width:auto;display:block;margin:0 auto 34px}
#lang .lgh{font-size:30px;font-weight:800;color:#1d1d1f;margin:0 0 6px;line-height:1.3}
#lang .lgt{margin:0 0 30px;color:#6e6e73;font-size:16px}
#lang a{display:block;box-sizing:border-box;border:2px solid #167398;color:#167398;background:#fff;border-radius:999px;padding:16px;text-align:center;font-size:21px;font-weight:800;margin:16px 0;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;text-decoration:none}
#lang a:first-of-type{background:#167398;color:#fff}
#lang a:active{transform:scale(.98)}#lang a.wait{opacity:.5}
</style>
</head>
